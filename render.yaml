# Gerado por scripts/render-yaml.mjs a partir de scripts/headers.mjs — não editar à mão.
# IMPORTANTE: o QR dos convites aponta para a URL deste serviço. Nunca apague nem renomeie o serviço.
services:
  - type: web
    name: makso
    runtime: static
    buildCommand: node scripts/build.mjs
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: "/*"
        name: "Content-Security-Policy"
        value: "default-src 'self'; script-src 'self' https://cloud.umami.is; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com https://cloud.umami.is https://api-gateway.umami.dev; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
      - path: "/*"
        name: "X-Robots-Tag"
        value: "noindex"
      - path: "/*"
        name: "Referrer-Policy"
        value: "strict-origin-when-cross-origin"
      - path: "/*"
        name: "X-Content-Type-Options"
        value: "nosniff"
      - path: "/*"
        name: "Permissions-Policy"
        value: "camera=(), microphone=(), geolocation=()"
      - path: "/"
        name: "Cache-Control"
        value: "no-cache"
      - path: "/index.html"
        name: "Cache-Control"
        value: "no-cache"
      - path: "/event.json"
        name: "Cache-Control"
        value: "no-cache"
      - path: "/evento.ics"
        name: "Cache-Control"
        value: "no-cache"
      - path: "/assets/*"
        name: "Cache-Control"
        value: "public, max-age=31536000, immutable"
